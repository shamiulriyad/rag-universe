name: Docs checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  internal-links:
    name: Internal Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check internal links and anchors
        run: python scripts/check_links.py
